replicaCount: 3
image:
  repository: ghcr.io/livininthelast/lispflow
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

worker:
  enabled: true
  replicaCount: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.lispflow.dev
      paths: [{ path: /, pathType: Prefix }]
  tls:
    - secretName: lispflow-tls
      hosts: [api.lispflow.dev]

resources:
  limits: { cpu: 500m, memory: 512Mi }
  requests: { cpu: 250m, memory: 256Mi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  enabled: true
  auth:
    database: lispflow
    username: lispflow

redis:
  enabled: true

config:
  log_level: info

secret:
  database_url: ""
  redis_url: ""

podAntiAffinity: true
