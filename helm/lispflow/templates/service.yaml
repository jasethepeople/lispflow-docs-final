apiVersion: v1
kind: Service
metadata:
  name: {{ include "lispflow.fullname" . }}
  labels: {{ include "lispflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "lispflow.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: api
