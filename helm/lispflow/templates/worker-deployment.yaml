{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lispflow.fullname" . }}-worker
  labels: {{ include "lispflow.labels" . | nindent 4 }}
    component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lispflow.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lispflow.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/app/lispflow", "worker"]
          envFrom:
            - configMapRef: { name: {{ include "lispflow.fullname" . }}-config }
            - secretRef: { name: {{ include "lispflow.fullname" . }}-secret }
          resources: {{ toYaml .Values.resources | nindent 12 }}
{{- end }}
