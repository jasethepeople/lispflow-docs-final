apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lispflow.fullname" . }}-secret
  labels: {{ include "lispflow.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secret.database_url }}
  DATABASE_URL: {{ .Values.secret.database_url | b64enc }}
  {{- end }}
  {{- if .Values.secret.redis_url }}
  REDIS_URL: {{ .Values.secret.redis_url | b64enc }}
  {{- end }}
