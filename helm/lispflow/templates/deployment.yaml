apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lispflow.fullname" . }}-api
  labels: {{ include "lispflow.labels" . | nindent 4 }}
    component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lispflow.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lispflow.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        component: api
    spec:
      serviceAccountName: {{ include "lispflow.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- if .Values.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "lispflow.name" . }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/lispflow", "api"]
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: {{ include "lispflow.fullname" . }}-config }
            - secretRef: { name: {{ include "lispflow.fullname" . }}-secret }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{ toYaml .Values.resources | nindent 12 }}
