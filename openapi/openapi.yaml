openapi: 3.0.3
info:
  title: LispFlow Billing API
  version: 1.0.0
  description: Production Lisp-based usage metering and billing engine
servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.lispflow.dev
    description: Production
tags:
  - name: observability
  - name: plans
  - name: evaluation
  - name: simulation
paths:
  /health:
    get:
      tags: [observability]
      summary: Health check
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }
  /ready:
    get:
      tags: [observability]
      summary: Readiness
      responses:
        '200': { description: Ready }
  /metrics:
    get:
      tags: [observability]
      summary: Prometheus metrics
      responses:
        '200': { description: Metrics, content: { text/plain: { schema: { type: string } } } }
  /customers/{id}/plans:
    post:
      tags: [plans]
      summary: Create or update plan
      parameters:
        - in: path, name: id, required: true, schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [expression], properties: { expression: { type: string, example: "(tiered api_calls 0.01 1000 0.008 10000 0.005)" } } }
      responses:
        '200': { description: Plan, content: { application/json: { schema: { $ref: '#/components/schemas/Plan' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /customers/{id}/evaluate:
    post:
      tags: [evaluation]
      summary: Evaluate single usage event
      parameters:
        - in: path, name: id, required: true, schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metrics: { type: object, additionalProperties: { type: number }, example: { api_calls: 1500, storage_gb: 20 } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationResult' } } } }
  /customers/{id}/batch:
    post:
      tags: [evaluation]
      summary: Batch evaluation
      parameters:
        - in: path, name: id, required: true, schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events: { type: array, items: { type: object, additionalProperties: { type: number } } }
      responses:
        '200': { description: Results, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EvaluationResult' } } } } }
  /customers/{id}/history:
    get:
      tags: [evaluation]
      summary: Paginated ledger
      parameters:
        - in: path, name: id, required: true, schema: { type: string }
        - in: query, name: limit, schema: { type: integer, default: 20 }
        - in: query, name: offset, schema: { type: integer, default: 0 }
      responses:
        '200': { description: Ledger, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } } } } }
  /simulate:
    post:
      tags: [simulation]
      summary: Time-travel simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_expression: { type: string }
                scenarios: { type: array, items: { type: object, additionalProperties: { type: number } } }
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
      responses:
        '200': { description: Simulation, content: { application/json: { schema: { $ref: '#/components/schemas/SimulateResponse' } } } }
  /validate:
    post:
      tags: [plans]
      summary: Validate Lisp expression
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { expression: { type: string } } }
      responses:
        '200': { description: Valid, content: { application/json: { schema: { type: object, properties: { valid: { type: boolean }, error: { type: string } } } } } }

components:
  schemas:
    Plan:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        version: { type: integer }
        expression: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    EvaluationResult:
      type: object
      properties:
        customer_id: { type: string }
        amount: { type: number }
        breakdown: { type: object, additionalProperties: { type: number } }
        plan_id: { type: string }
        version: { type: integer }
        timestamp: { type: string, format: date-time }
    LedgerEntry:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        plan_id: { type: string }
        amount: { type: number }
        created_at: { type: string, format: date-time }
    SimulateResponse:
      type: object
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/EvaluationResult' } }
        total_revenue: { type: number }
        avg_revenue: { type: number }
        cost_breakdown: { type: object, additionalProperties: { type: number } }
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string } } }
